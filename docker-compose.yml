# Prototipo de Aula Virtual – Asesores Unidos S.A.C. (Moodle 4.5 LTS + MySQL 8.4)
name: ausac-moodle

services:
  web:
    image: moodlehq/moodle-php-apache:8.3
    depends_on:
      - db
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./moodle:/var/www/html
      - ./scripts:/opt/ausac:ro
      - moodledata:/var/www/moodledata
    environment:
      MOODLE_DB_PASS: "m@0dl3ing"

  db:
    image: mysql:8.4
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_bin
      --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: "m@0dl3ing"
      MYSQL_USER: moodle
      MYSQL_PASSWORD: "m@0dl3ing"
      MYSQL_DATABASE: moodle
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
  moodledata:
